<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F3F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141517" media="(prefers-color-scheme: dark)">
<meta name="description" content="Controle da fatura do cartão, mês a mês, por pessoa.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Economize">
<title>Me Economize</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, tidy money app; the number first, no bureaucracy.
   IDEA: the credit card statement as a phone wallet — one card, one month at a time.
   PICTURE: the month's total huge on a faint grid, the lime card, people as avatars.
   COLOUR and TYPE: soft grey ground, white cards, black pills, one lime accent; Inter Tight.
   LAYOUT: single phone-width column, floating black tab bar, bottom sheets for actions. */
:root{color-scheme:light dark;
--bg:light-dark(#E9EAEC,#0D0E0F);--app:light-dark(#F3F3F4,#141517);--card:light-dark(#FFFFFF,#1C1D20);--soft:light-dark(#F1F2F3,#26272B);
--ink:light-dark(#111214,#F2F2F3);--mute:light-dark(#74777D,#9B9EA4);--line:light-dark(#E3E4E7,#2C2D31);
--lime:#C3EA1E;--limeInk:#111214;--limeDeep:light-dark(#6F8F00,#C3EA1E);--red:light-dark(#C62E2A,#FF7A70);
--pill:#111214;--pillInk:#fff;--grid:light-dark(rgba(0,0,0,.045),rgba(255,255,255,.04));--shadow:light-dark(0 1px 2px rgba(0,0,0,.04),none)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Inter Tight",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--limeDeep);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--app);padding:env(safe-area-inset-top) max(14px,env(safe-area-inset-right)) 120px max(14px,env(safe-area-inset-left));position:relative}
@media(min-width:560px){.app{margin:20px auto;min-height:calc(100vh - 40px);border-radius:36px;box-shadow:0 0 0 1px var(--line)}}
.top{display:flex;align-items:center;justify-content:space-between;padding:22px 4px 8px;gap:10px}
.logo{font-size:26px;font-weight:700;letter-spacing:-.04em}
.logo b{color:var(--limeDeep)}
.ib{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.ib svg,.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero{text-align:center;padding:14px 0 18px;margin:0 -14px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;background-position:center}
.mnav{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--mute);font-size:15px}
.mnav button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.mnav button:hover{background:var(--soft)}
.mnav .lab{min-width:170px;font-weight:500}
.big{font-size:clamp(40px,12vw,52px);font-weight:700;letter-spacing:-.045em;line-height:1.05;margin:6px 0 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--mute)}
.tag b{color:var(--ink);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.open{background:var(--lime)}.dot.closed{background:var(--ink)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 12px}
.btn{height:52px;border-radius:99px;background:var(--card);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;box-shadow:var(--shadow);padding:0 18px}
.btn.dark{background:var(--pill);color:var(--pillInk)}
.btn.lime{background:var(--lime);color:var(--limeInk)}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.promo{background:#111214;color:#fff;border-radius:22px;padding:16px 18px;display:flex;align-items:center;gap:14px;margin-bottom:12px;position:relative;overflow:hidden}
:root[data-theme=dark] .promo,.promo{box-shadow:0 0 0 1px var(--line)}
.promo .t{font-weight:600;font-size:15px}
.promo .s{color:#B9BBC0;font-size:13px;line-height:1.35;margin-top:2px}
.promo .s b{color:#fff;font-weight:600}
.coin{width:62px;height:62px;border-radius:50%;flex:none;margin-left:auto;background:radial-gradient(circle at 35% 30%,#F6FFD0,#C3EA1E 45%,#7E9A06 100%);display:grid;place-items:center;color:#2b3600;font-weight:700;font-size:22px;box-shadow:inset -3px -4px 6px rgba(0,0,0,.25),inset 2px 2px 4px rgba(255,255,255,.6)}
.panel{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.ph h2{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
.link{font-size:13px;color:var(--mute);padding:6px 10px;border-radius:99px;background:var(--soft)}
.people{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.people::-webkit-scrollbar{display:none}
.pp{display:flex;flex-direction:column;align-items:center;gap:5px;flex:none;width:68px;text-align:center}
.pp .n{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:68px}
.pp .v{font-size:12px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.pp.sel .av{box-shadow:0 0 0 3px var(--lime)}
.pp.done .v{color:var(--limeDeep)}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:17px;flex:none;position:relative;color:#1a1a1a}
.av.sm{width:42px;height:42px;font-size:15px}
.av.xs{width:30px;height:30px;font-size:12px}
.av svg{position:absolute;inset:0;width:100%;height:100%;border-radius:50%}
.av.xl{width:120px;height:120px;font-size:40px;margin:4px auto 12px}
button.av{cursor:pointer}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{width:52px;height:52px;border-radius:50%;padding:0;position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.opt.on{box-shadow:0 0 0 3px var(--ink)}
.opt svg{width:100%;height:100%;display:block}
.sw{width:36px;height:36px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.sw.on{box-shadow:0 0 0 3px var(--app),0 0 0 5px var(--ink)}
.av .ok{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;border-radius:50%;background:var(--lime);border:2px solid var(--card);display:grid;place-items:center}
.av .ok svg{width:10px;height:10px;stroke:#111;stroke-width:3;fill:none}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-child{border-top:0}
.row .m{flex:1;overflow:hidden}
.row .d{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.row .val small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.row.paid .val{color:var(--limeDeep)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.chk.on{background:var(--lime);border-color:var(--lime)}
.chk svg{width:13px;height:13px;stroke:#111;stroke-width:3;fill:none;opacity:0}
.chk.on svg{opacity:1}
.filter{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 6px;padding:0 16px}
.filter::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;border-radius:99px;background:var(--soft);padding:0 14px;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--pill);color:var(--pillInk)}
.chip.lime.on{background:var(--lime);color:var(--limeInk)}
.chip .av{width:24px;height:24px;font-size:11px;margin-left:-8px}
.empty{text-align:center;color:var(--mute);padding:26px 10px;font-size:15px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));background:#111214;border-radius:99px;padding:7px;display:flex;gap:4px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.06)}
.nav button{height:46px;min-width:46px;border-radius:99px;display:flex;align-items:center;justify-content:center;gap:7px;color:#C9CBD0;padding:0 12px;font-size:14px;font-weight:500}
.nav button span{display:none}
.nav button.on{background:var(--lime);color:#111}
.nav button.on span{display:inline}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:max(86px,calc(env(safe-area-inset-bottom) + 70px));width:58px;height:58px;border-radius:50%;background:var(--lime);color:#111;display:grid;place-items:center;z-index:19;box-shadow:0 8px 22px rgba(0,0,0,.22)}
.fab svg{width:26px;height:26px;stroke-width:2.2}
/* months */
.mrow{display:grid;grid-template-columns:88px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.mrow:first-child{border-top:0}
.mrow .ml{font-weight:500;font-size:15px}
.mrow .ml small{display:block;font-size:12px;color:var(--mute);font-weight:400}
.bar{height:12px;border-radius:99px;background:var(--soft);display:flex;overflow:hidden}
.bar i{display:block;height:100%}
.bar .me{background:var(--lime)}.bar .ot{background:var(--ink);opacity:.8}
.mrow .val{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.mrow.cur{background:var(--soft);border-radius:14px;padding:10px;margin:0 -10px;border-top-color:transparent}
.legend{display:flex;gap:14px;font-size:13px;color:var(--mute);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* card */
.ccard{border-radius:22px;padding:18px;position:relative;overflow:hidden;background:var(--lime);color:#111;min-height:190px;display:flex;flex-direction:column;margin-bottom:12px}
.ccard>*{position:relative;z-index:1}.ccard .wm{position:absolute;z-index:0;left:-4px;bottom:-30px;font-size:110px;font-weight:700;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:1.2px rgba(0,0,0,.09);white-space:nowrap;pointer-events:none}
.ccard .brand{font-weight:700;font-size:18px;letter-spacing:-.02em;font-style:italic}
.ccard .amt{font-size:30px;font-weight:600;letter-spacing:-.03em;margin-top:2px}
.ccard .lb{font-size:14px}
.ccard .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;position:relative}
.ccard .main{background:#111;color:#fff;border-radius:99px;padding:6px 12px;font-size:13px;display:flex;gap:6px;align-items:center}
.meter{height:8px;border-radius:99px;background:rgba(0,0,0,.12);overflow:hidden;margin:12px 0 18px}
.meter i{display:block;height:100%;background:#111}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
.field label{color:var(--mute);font-size:15px}
.inp{height:44px;border-radius:14px;border:1px solid var(--line);background:var(--soft);padding:0 14px;font-size:16px;width:100%}
.field .inp{width:120px;text-align:right}
.note{font-size:13px;color:var(--mute);margin:6px 2px 0}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,11,12,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{background:var(--app);width:100%;max-width:520px;max-height:94vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:14px 14px max(18px,env(safe-area-inset-bottom));animation:up .22s ease-out}
@media(min-width:560px){.scrim{align-items:center}.sheet{border-radius:28px;max-height:90vh}}
@keyframes up{from{transform:translateY(30px);opacity:.6}}@keyframes fade{from{opacity:0}}
@media(prefers-reduced-motion:reduce){.scrim,.sheet{animation:none}}
.sh{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;margin-bottom:10px}
.sh h3{margin:0;text-align:center;font-size:17px;font-weight:600}
.amtbox{text-align:center;padding:16px 0 8px}
.amtin{border:0;background:none;text-align:center;font-size:clamp(40px,13vw,56px);font-weight:700;letter-spacing:-.045em;width:100%;caret-color:var(--limeDeep);font-variant-numeric:tabular-nums;outline:none}
.amtin:focus-visible{outline:none}
.hint{font-size:14px;color:var(--mute);text-align:center;min-height:20px}
.hint b{color:var(--ink);font-weight:600}
.lbl{font-size:13px;color:var(--mute);margin:0 0 8px 2px}
.addp{display:flex;gap:8px;margin-top:10px}
.cardline{display:flex;align-items:center;gap:12px}
.mini{width:46px;height:30px;border-radius:6px;background:var(--lime);flex:none;position:relative;overflow:hidden}
.mini:after{content:"";position:absolute;left:6px;bottom:6px;width:18px;height:3px;border-radius:2px;background:rgba(0,0,0,.25)}
.seg{display:flex;background:var(--soft);border-radius:99px;padding:4px;margin-bottom:12px}
.seg button{flex:1;height:40px;border-radius:99px;font-size:14px;font-weight:500;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
textarea.inp{height:180px;padding:12px 14px;resize:vertical;font-size:14px;line-height:1.4}
.drop{border:1.5px dashed var(--line);border-radius:18px;padding:24px;text-align:center;color:var(--mute);display:block;cursor:pointer}
.drop b{color:var(--ink)}
.drop input{display:none}
.irow{padding:10px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:start}
.irow:first-child{border-top:0}
.irow .d{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow .sub{font-size:13px;color:var(--mute)}
.irow .val{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.irow .sels{grid-column:2/4;display:flex;gap:8px;flex-wrap:wrap}
.irow.off{opacity:.5}
.sel{height:36px;border-radius:99px;background:var(--soft);border:0;padding:0 30px 0 12px;font-size:14px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 16px,calc(100% - 10px) 16px;background-size:5px 5px;background-repeat:no-repeat;max-width:100%}
details summary{cursor:pointer;list-style:none;font-weight:500;padding:6px 0}
details summary::-webkit-details-marker{display:none}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111214;color:#fff;border-radius:99px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:12px;z-index:60;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.toast button{background:var(--lime);color:#111;border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px}
.warn{background:#FFF3C4;color:#4a3b00;border-radius:16px;padding:10px 14px;font-size:13px;margin-bottom:12px}
.danger{color:var(--red)}
.prow{flex-wrap:wrap}.prow .pact{flex-basis:100%;padding-left:54px;margin-top:0}
.pact{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pact .chip{height:32px;font-size:13px}
.welcome{text-align:center;padding:30px 10px}
.welcome h1{font-size:34px;letter-spacing:-.04em;line-height:1.05;margin:10px 0}
.welcome p{color:var(--mute);margin:0 0 20px}
.srch{margin-bottom:10px}
</style>
</head>
<body>
<div class="app">
  <div id="view"></div>
</div>
<button class="fab" id="fab" data-act="novaCompra" aria-label="Nova compra"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="nav" id="nav" aria-label="Seções">
  <button data-act="tab" data-t="fatura" aria-label="Fatura"><svg class="ico" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span>Fatura</span></button>
  <button data-act="tab" data-t="meses" aria-label="Meses"><svg class="ico" viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Meses</span></button>
  <button data-act="tab" data-t="pessoas" aria-label="Pessoas"><svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.4 3.5 5.2"/></svg><span>Pessoas</span></button>
  <button data-act="tab" data-t="cartao" aria-label="Cartão"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/></svg><span>Cartão</span></button>
</nav>
<div id="sheet"></div>
<div id="toast"></div>
<script>
{
const KEY='meeconomize.v2';
var ui=null;
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const CATS=['Roupas','Casa','Uber/99','Saúde','Alimentação','Supermercado','Assinaturas','Transporte','Lazer','Delivery','Educação','Outros'];
const PAL=['#C3EA1E','#FFD6A5','#BDE0FE','#FFC8DD','#CDB4DB','#B9FBC0','#FDE4CF','#A0C4FF','#FFADAD','#E9EDC9','#D0F4DE','#FBF8CC'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const brl=v=>NF.format(v||0).replace(/ /g,' ');
const ICO={
  l:'<svg class="ico" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',
  r:'<svg class="ico" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  x:'<svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  ck:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  up:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M5 15v4h14v-4"/></svg>',
  plus:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  gear:'<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'
};

/* ---------- storage ---------- */
let storageOk=true;

function pessoasStats(){const o=openIdx(),m=new Map();const get=p=>{if(!m.has(p))m.set(p,{p,n:0,rec:0,fut:0,last:''});return m.get(p)};
  get('Você');Object.keys(S.pessoas).forEach(get);
  const lim=new Date(today.y,today.m,today.d-90).toISOString();
  for(const c of S.compras){const s=get(c.dono);s.n++;if(String(c.dataCriacao)>lim||String(c.dataCompra)>lim)s.rec++;if(String(c.dataCompra)>s.last)s.last=c.dataCompra;
    {const oc=openIdx(cardOf(c));for(const x of parcelas(c))if(x.idx>=oc)s.fut+=x.v}}
  for(const s of m.values()){const meta=S.pessoas[s.p]||{};s.arq=!!meta.arquivada&&s.p!=='Você';
    const nova=meta.criada&&(Date.now()-new Date(meta.criada).getTime()<60*864e5);
    s.ativa=s.p==='Você'||(!s.arq&&(s.fut>0.004||s.rec>0||nova))}
  return[...m.values()]}
function pessoasAtivas(){return pessoasStats().filter(s=>s.ativa).sort((a,b)=>(a.p==='Você'?-1:b.p==='Você'?1:0)||b.rec-a.rec||b.n-a.n).map(s=>s.p)}
function addPessoa(nome){nome=nome.trim().replace(/\s+/g,' ');if(!nome)return null;
  const ex=pessoasStats().find(s=>s.p.toLowerCase()===nome.toLowerCase()||disp(s.p).toLowerCase()===nome.toLowerCase());
  if(ex){if(S.pessoas[ex.p])S.pessoas[ex.p].arquivada=false;return ex.p}
  S.pessoas[nome]={criada:new Date().toISOString()};return nome}

/* ---------- category guess ---------- */
const norm=s=>String(s||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Z0-9]+/g,' ').trim();
const k1=s=>norm(s).split(' ').filter(w=>w.length>1).slice(0,2).join(' ');
function guess(desc){const k=k1(desc);if(!k)return null;let best=null;
  for(const c of S.compras){if(k1(c.descricao)===k&&(!best||String(c.dataCriacao)>String(best.dataCriacao)))best=c}
  if(best)return{cat:best.categoria,dono:best.dono};
  const n=norm(desc);if(/UBER|99 ?APP|99 RIDE|99POP|CABIFY/.test(n))return{cat:'Uber/99'};if(/IFOOD|99FOOD|RAPPI/.test(n))return{cat:'Delivery'};
  if(/FARMA|DROGA|PAGUE MENOS|RAIA|CLINIC|LAB/.test(n))return{cat:'Saúde'};if(/MERCADO|ATACAD|ASSAI|SUPER/.test(n)&&!/MERCADO ?LIVRE|MERCADOPAGO/.test(n))return{cat:'Supermercado'};
  if(/NETFLIX|SPOTIFY|DISNEY|PRIME|APPLE|GOOGLE|HBO|YOUTUBE/.test(n))return{cat:'Assinaturas'};if(/RENNER|RIACHUELO|CEA|C A |ZARA|HERING|AREZZO|CALCAD|SHEIN/.test(n))return{cat:'Roupas'};
  return null}
const cats=()=>{const s=new Set(S.categorias||CATS);S.compras.forEach(c=>c.categoria&&s.add(c.categoria));return[...s]};

const RX=/(\d{2})\/(\d{2})(?:\/\d{2,4})?\s+(.+?)\s+(?:(?:PARC(?:ELA)?\.?\s*)?(\d{1,2})\s*(?:\/|DE)\s*(\d{1,2})\s+)?(-\s*)?(?:R\$\s*)?(\d{1,3}(?:\.\d{3})*,\d{2})(\s*-)?(?!\d)/gi;
const SKIP=/PAGAMENTO|PAGTO|PGTO|SALDO|TOTAL|LIMITE|CREDITO|ESTORNO|DESCONTO|VENCIMENTO|FECHAMENTO|MINIMO|PROXIMA FATURA|LANCAMENTOS/;
function parseText(txt){
  const out=[],ign=[];const fi=I.idx,closeT=new Date(yOf(fi),mOf(fi),fech()+5).getTime();
  for(const ln of txt.split(/\n/)){RX.lastIndex=0;let m;
    while((m=RX.exec(ln))){let[,dd,mm,desc,k,n,neg1,val,neg2]=m;dd=+dd;mm=+mm;desc=desc.replace(/\s{2,}/g,' ').trim();
      if(dd<1||dd>31||mm<1||mm>12)continue;
      const v=+val.replace(/\./g,'').replace(',','.');
      // installment embedded at end of description, e.g. "LOJA 02/03"
      const em=!k&&desc.match(/^(.*?)\s+(?:PARC\.?\s*)?(\d{1,2})\/(\d{1,2})$/i);if(em&&+em[2]<=+em[3]&&+em[3]<=48){desc=em[1];k=em[2];n=em[3]}
      k=+k||1;n=+n||1;if(k>n||n>48){k=1;n=1}
      let y=yOf(fi);if(new Date(y,mm-1,dd).getTime()>closeT)y--;
      const rec={date:iso(y,mm-1,dd),desc,k,n,v,raw:m[0].trim()};
      if(neg1||neg2||SKIP.test(norm(desc))||v<=0){ign.push(rec);continue}
      out.push(rec)}}
  return{out,ign}}
function matchExisting(items){
  const used=new Set();
  for(const it of items){let best=null,bs=0;
    for(const c of doCartao()){if(used.has(c.id))continue;const n=Math.max(1,c.parcelas|0);if(n!==it.n)continue;
      const pv=parcelas(c),alvo=pv[it.k-1];if(!alvo)continue;
      if(Math.abs(alvo.v-it.v)>0.02&&Math.abs(c.valorTotal/n-it.v)>0.02)continue;
      let s=0;if(alvo.idx===I.idx)s+=2;const p=pd(c.dataCompra);if(p.d===+it.date.slice(8,10)&&p.m===+it.date.slice(5,7)-1)s+=2;
      const a=norm(c.descricao).replace(/ /g,''),b=norm(it.desc).replace(/ /g,'');if(a&&b&&(a.slice(0,5)===b.slice(0,5)||a.includes(b.slice(0,6))||b.includes(a.slice(0,6))))s+=1;
      if(s>=2&&s>bs){bs=s;best=c}}
    if(best){used.add(best.id);it.ja=best;it.on=false}else{it.on=true;const g=guess(it.desc)||{};it.dono=g.dono&&pessoasStats().some(s=>s.p===g.dono)?g.dono:'Você';it.cat=g.cat||''}}
  return items}
function lerTexto(txt){const{out,ign}=parseText(txt);if(!out.length&&!ign.length){toast('Não achei lançamentos nesse conteúdo');return}
  I.items=matchExisting(out);I.ign=ign;sheetReview()}
function sheetReview(){

/* PDF reading via pdf.js (loaded on demand) */
let pdfLib=null;
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function getPdf(){if(pdfLib)return pdfLib;const b='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  await loadScript(b+'pdf.min.js');await loadScript(b+'pdf.worker.min.js');pdfLib=window.pdfjsLib;return pdfLib}
async function lerPdf(file,pw){const msg=t=>{const e=$('#iMsg');if(e)e.textContent=t};
  try{msg('Lendo PDF…');const lib=await getPdf();const data=new Uint8Array(await file.arrayBuffer());
    const doc=await lib.getDocument({data,password:pw||undefined,isEvalSupported:false}).promise;let txt='';
    for(let p=1;p<=doc.numPages;p++){const pg=await doc.getPage(p);const tc=await pg.getTextContent();const rows=[];
      for(const it of tc.items){if(!it.str||!it.str.trim())continue;const y=it.transform[5],x=it.transform[4];let r=rows.find(r=>Math.abs(r.y-y)<2.5);if(!r){r={y,its:[]};rows.push(r)}r.its.push({x,s:it.str,w:it.width||0})}
      rows.sort((a,b)=>b.y-a.y);
      for(const r of rows){r.its.sort((a,b)=>a.x-b.x);let line='',end=null;for(const it of r.its){if(end!==null&&it.x-end>40)line+='\n';else if(end!==null)line+=' ';line+=it.s;end=it.x+it.w}txt+=line+'\n'}}
    lerTexto(txt)}
  catch(e){if(e&&e.name==='PasswordException'){I.file=file;I.pw=true;const w=$('#iPw');if(w){w.hidden=false;$('#iPwIn').focus()}msg(pw?'Senha incorreta, tente de novo':'Este PDF tem senha');}
    else{msg('Não consegui ler este PDF. Tente colar o texto.');console.error(e)}}}

/* ---------- backup ---------- */
function exportJSON(){return JSON.stringify({cartoes:S.cartoes,principal:S.principal,compras:S.compras,usuario:S.usuario,entradas:[],orcamentos:[],pessoas:S.pessoas,categorias:S.categorias,timestamp:new Date().toISOString(),app:'meeconomize-v2'},null,1)}
async function exportar(){const data=exportJSON(),fn=`backup_meeconomize_${todayISO}.json`;let ok=false;
  try{const d=await window.claude?.use?.('downloads');if(d){await d.save({filename:fn,data});ok=true}}catch(e){}
  if(!ok){try{const file=new File([data],fn,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})&&/Android|iPhone|iPad/i.test(navigator.userAgent)){await navigator.share({files:[file],title:fn});ok=true}}catch(e){if(e&&e.name==='AbortError')return}}
  if(!ok){try{const u=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);ok=!window.claude}catch(e){}}
  if(!ok){openSheet(sh('Exportar backup')+`<p class="note">Se o download não começou, copie o conteúdo e salve num arquivo .json.</p><textarea class="inp" readonly style="height:220px" id="bkTxt">${esc(data)}</textarea><button class="btn dark wide" data-act="copiar" style="margin-top:12px">Copiar</button>`)}
  S.ultimoBackup=new Date().toISOString();save();if(ok){render();toast('Backup salvo')}}
function importarBackup(txt){let d;try{d=JSON.parse(txt)}catch(e){toast('Arquivo inválido');return}
  if(!Array.isArray(d.compras)){toast('Esse arquivo não parece um backup');return}
  const apply=(modo)=>{const before=JSON.stringify(S);
    if(modo==='trocar'){S=Object.assign(blank(),{compras:[]})}
    const ks=(Array.isArray(d.cartoes)&&d.cartoes.length?d.cartoes:(d.cartao?[d.cartao]:[])).filter(k=>k&&k.id);
    if(ks.length){if(modo==='trocar'||!S.compras.length){S.cartoes=ks;S.principal=d.principal||ks[0].id}else{for(const k of ks)if(!kById(k.id))S.cartoes.push(k)}}
    if(d.usuario&&d.usuario.nome&&(modo==='trocar'||!S.usuario.nome))S.usuario={nome:d.usuario.nome};
    Object.assign(S.pessoas,d.pessoas||{});if(Array.isArray(d.categorias))S.categorias=[...new Set([...(S.categorias||[]),...d.categorias])];
    const ids=new Set(S.compras.map(c=>c.id));let n=0;for(const c of d.compras){if(ids.has(c.id))continue;S.compras.push(c);n++}
    migrar();ui.card=S.principal;
    S.iniciado=true;save();undo=before;closeSheet();ui.idx=openIdx();ui.tab='fatura';render();toast(`${n} compras importadas`,true)};
  if(!S.compras.length)return apply('trocar');
  importarBackup.apply=apply;
  openSheet(sh('Importar backup')+`<div class="panel"><p style="margin:0">O arquivo tem <b>${d.compras.length}</b> compras. Você já tem <b>${S.compras.length}</b> aqui.</p></div>
<button class="btn dark wide" data-act="bkModo" data-m="juntar" style="margin-bottom:10px">Juntar (só adiciona o que falta)</button><button class="btn wide" data-act="bkModo" data-m="trocar">Substituir tudo</button>`)}

/* ---------- events ---------- */
function setQuit(c,k,v){c.parcelasQuitadas=Array.from({length:c.parcelas},(_,j)=>j===k?v:!!(c.parcelasQuitadas||[])[j])}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='scrim'){if(e.target===el)closeSheet();return}
  if(el.tagName==='SELECT'||el.type==='file')return;
  const ds=el.dataset;
  switch(a){
  case'tab':ui.tab=ds.t;ui.who=null;render();scrollTo(0,0);break;
  case'mes':ui.idx+=+ds.d;ui.who=null;render();break;
  case'hoje':ui.idx=openIdx();ui.who=null;render();break;
  case'irMes':ui.idx=+ds.i;ui.tab='fatura';ui.who=null;render();scrollTo(0,0);break;
  case'who':ui.who=ds.p&&ui.who!==ds.p?ds.p:null;render();break;
  case'novaCompra':formCompra();break;
  case'editar':{const c=S.compras.find(c=>c.id===ds.id);formCompra(c);F.origDate=F.date;F.origCard=F.card;fHint();break}
  case'fCard':{F.card=ds.v;const k=kById(F.card);document.querySelectorAll('#fCard .chip').forEach(b=>b.classList.toggle('on',b.dataset.v===F.card));$('#fMini').style.background=corDe(k)[0];$('#fCardNome').textContent=k.nome||'Cartão';fHint();break}
  case'close':closeSheet();break;
  case'fP':F.dono=ds.p;document.querySelectorAll('#fPeople [data-act=fP]').forEach(b=>b.classList.toggle('on',b.dataset.p===F.dono));fHint();break;
  case'fNovaP':{const b=$('#fAdd');b.hidden=!b.hidden;if(!b.hidden)$('#fNome').focus();break}
  case'fAddOk':{const p=addPessoa($('#fNome').value);if(!p)return;save();F.dono=p;
    if(!document.querySelector(`#fPeople [data-p="${CSS.escape(p)}"]`))$('#fPeople [data-act=fNovaP]').insertAdjacentHTML('beforebegin',pChip(p));
    document.querySelectorAll('#fPeople [data-act=fP]').forEach(b=>b.classList.toggle('on',b.dataset.p===F.dono));$('#fAdd').hidden=true;$('#fNome').value='';fHint();break}
  case'fParcMais':{const bx=$('#fParcBox'),pn=$('#fParcN');if(bx.style.display==='none'){bx.style.display='flex';pn.focus()}else if(!(F.parc>12)){bx.style.display='none'}else pn.focus()}break;
  case'fParc':F.parc=+ds.n;{const pn=$('#fParcN'),bx=$('#fParcBox'),pm=$('#fParcMais');if(pn)pn.value='';if(bx)bx.style.display='none';if(pm){pm.textContent='+';pm.classList.remove('on')}}document.querySelectorAll('#fParc .chip').forEach(b=>b.classList.toggle('on',+b.dataset.n===F.parc));fHint();break;
  case'fDia':F.date=ds.v;$('#fDt').value=F.date;document.querySelectorAll('#fDate .chip').forEach(b=>b.classList.toggle('on',b.dataset.v===F.date));fHint();break;
  case'fCat':F.cat=ds.v;F.catTouched=true;document.querySelectorAll('#fCat .chip').forEach(b=>b.classList.toggle('on',b.dataset.v===F.cat));break;
  case'fSalvar':salvarCompra(!!ds.more);break;
  case'delCompra':{const id=F.id;snapshot('Compra excluída');S.compras=S.compras.filter(c=>c.id!==id);save();closeSheet();render();break}
  case'undo':if(undo){S=JSON.parse(undo);undo=null;migrar();if(!kById(ui.card))ui.card=S.principal;save();render();$('#toast').innerHTML=''}break;
  case'importar':I=null;sheetImport();break;
  case'iMes':I.idx+=+ds.d;sheetImport();break;
  case'iMode':I.text=$('#iTxt')?.value||I.text;I.mode=ds.m;sheetImport();break;
  case'iLer':I.text=$('#iTxt').value;lerTexto(I.text);break;
  case'iPwOk':if(I.file)lerPdf(I.file,$('#iPwIn').value);break;
  case'iTog':{const x=I.items[+ds.i];x.on=!x.on;if(x.on&&!x.dono){const g=guess(x.desc)||{};x.dono=x.ja?.dono||'Você';x.cat=x.ja?.categoria||g.cat||''}const st=$('.sheet').scrollTop;sheetReview();$('.sheet').scrollTop=st;break}
  case'iTodos':{const nv=I.items.filter(x=>!x.ja);const v=!nv.every(x=>x.on);nv.forEach(x=>x.on=v);const st=$('.sheet').scrollTop;sheetReview();$('.sheet').scrollTop=st;break}
  case'iVoltar':I.items=null;sheetImport();break;
  case'iSalvar':salvarImport();break;
  case'pNova':openSheet(sh('Nova pessoa')+`<section class="panel"><input class="inp" id="npNome" placeholder="Nome" aria-label="Nome"></section><button class="btn dark wide" data-act="npOk">Adicionar</button>`);setTimeout(()=>$('#npNome').focus(),50);break;
  case'npOk':{const p=addPessoa($('#npNome').value);if(p){save();closeSheet();render();toast(`${p} adicionada`)}break}
  case'pArq':{S.pessoas[ds.p]=Object.assign(S.pessoas[ds.p]||{},{arquivada:ds.v==='1'});if(ds.v==='0')S.pessoas[ds.p].criada=new Date().toISOString();save();render();toast(ds.v==='1'?`${ds.p} arquivada`:`${ds.p} reativada`);break}
  case'pDel':{snapshot(`${ds.p} excluída`);delete S.pessoas[ds.p];save();render();break}
  case'avEdit':AV=null;sheetAvatar(ds.p);break;
  case'avSet':AV.a[ds.k]=(ds.k==='oculos'||ds.k==='bone')?ds.v==='1':ds.v;if(ds.k==='len')AV.a.corte=(AVO.cortes[ds.v]||[''])[0]||'';AV.a=avSan(AV.a);sheetAvatar(AV.p);break;
  case'avRand':{const pk=l=>l[Math.floor(Math.random()*l.length)];AV.a={bg:pk(AVO.bg),skin:pk(AVO.skin),...(()=>{const len=pk(AVO.len);return{len,tex:pk(AVO.tex),corte:pk(AVO.cortes[len].length?AVO.cortes[len].slice(0,len==='curto'?6:9):[''])}})(),bone:Math.random()<.12,hc:pk(AVO.hc),face:pk(AVO.face),oculos:Math.random()<.25,barba:Math.random()<.3?pk(AVO.barba.slice(1)):'nenhuma',blusa:pk(AVO.blusa),bc:pk(AVO.bc)};sheetAvatar(AV.p);break}
  case'avOk':S.pessoas[AV.p]=Object.assign(S.pessoas[AV.p]||{},{avatar:avSan(AV.a)});save();closeSheet();AV=null;render();toast('Carinha salva');break;
  case'avIni':if(S.pessoas[AV.p])delete S.pessoas[AV.p].avatar;save();closeSheet();AV=null;render();toast('Voltou para as iniciais');break;
  case'pRen':{const outros=pessoasStats().map(s=>s.p).filter(p=>p!==ds.p);
    openSheet(sh('Renomear ou juntar')+`<section class="panel"><div class="lbl">Novo nome para ${esc(ds.p)}</div><input class="inp" id="rnNome" value="${esc(ds.p)}" aria-label="Novo nome"><p class="note">Se o nome já existir, as compras das duas pessoas são juntadas.</p>
    <div class="lbl" style="margin-top:12px">Ou juntar com</div><div class="filter" style="flex-wrap:wrap">${outros.map(p=>`<button class="chip" data-act="rnPick" data-p="${esc(p)}">${av(p,'xs')}${esc(disp(p))}</button>`).join('')}</div></section><button class="btn dark wide" data-act="rnOk" data-from="${esc(ds.p)}">Salvar</button>`);break}
  case'rnPick':$('#rnNome').value=ds.p;break;
  case'rnOk':{const from=ds.from;let to=$('#rnNome').value.trim().replace(/\s+/g,' ');if(!to||to===from){closeSheet();return}
    const ex=pessoasStats().find(s=>s.p.toLowerCase()===to.toLowerCase()||(s.p==='Você'&&disp('Você').toLowerCase()===to.toLowerCase()));if(ex)to=ex.p;
    snapshot(ex?`${from} juntada com ${disp(to)}`:`Renomeada para ${to}`);S.compras.forEach(c=>{if(c.dono===from)c.dono=to});
    if(!ex)S.pessoas[to]=Object.assign({},S.pessoas[from]||{},{criada:(S.pessoas[from]||{}).criada||new Date().toISOString()});delete S.pessoas[from];
    if(ui.who===from)ui.who=null;save();closeSheet();render();break}
  case'exportar':exportar();break;
  case'selCartao':setCard(ds.id);render();break;
  case'escolherCartao':openSheet(sh('Escolher cartão',`<button class="ib" data-act="novoCartao" aria-label="Novo cartão">${ICO.plus}</button>`)+S.cartoes.map(k=>cardHTML(k,k.id===K().id).replace('data-act="selCartao"','data-act="pickCartao"')).join(''));break;
  case'pickCartao':setCard(ds.id);closeSheet();render();break;
  case'novoCartao':sheetNovoCartao();break;
  case'nCor':NK.cor=ds.v;document.querySelectorAll('[data-act=nCor]').forEach(b=>b.classList.toggle('on',b.dataset.v===NK.cor));document.querySelector('[data-act=nCorX]')?.closest('label').classList.remove('on');break;
  case'kCor':K().cor=ds.v;save();render();break;
  case'nkOk':{document.querySelectorAll('.sheet [data-k]').forEach(applyK.bind(null,NK));if(!NK.nome){toast('Dê um nome ao cartão');$('#nN').focus();return}
    S.cartoes.push(NK);setCard(NK.id);closeSheet();ui.tab='cartao';render();toast(`${NK.nome} adicionado`);break}
  case'kPrinc':S.principal=K().id;save();render();toast(`${K().nome} é o principal`);break;
  case'kDel':{const k=K(),n=doCartao(k).length;confirmSheet('Excluir cartão',`Excluir <b>${esc(k.nome)}</b>${n?` e as <b>${n}</b> compras dele`:''}? Dá para desfazer logo em seguida.`,'Excluir cartão',()=>{
    const b=JSON.stringify(S);S.compras=S.compras.filter(c=>c.cartaoId!==k.id);S.cartoes=S.cartoes.filter(x=>x.id!==k.id);if(S.principal===k.id)S.principal=S.cartoes[0].id;setCard(S.principal);undo=b;closeSheet();render();toast('Cartão excluído',true)});break}
  case'iCard':setCard(ds.v);I.idx=defaultImportIdx();render();sheetImport();break;
  case'copiar':{const t=$('#bkTxt');t.select();navigator.clipboard?.writeText(t.value).then(()=>toast('Copiado')).catch(()=>toast('Selecionado: copie com Ctrl+C'));break}
  case'bkModo':importarBackup.apply(ds.m);break;
  case'comecar':S.iniciado=true;save();render();break;
  case'zerar':confirmSheet('Apagar tudo','Isso apaga todas as compras e pessoas deste navegador. Exporte um backup antes se quiser guardar.','Apagar tudo',()=>{const b=JSON.stringify(S);S=blank();ui.card=S.principal;ui.idx=openIdx();save();undo=b;closeSheet();render();toast('Dados apagados',true)});break;
  case'okConf':confirmSheet.cb&&confirmSheet.cb();break;
  }
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='fAmt'){t.value=brl(F.cents/100);fHint()}
  else if(t.id==='fParcN'&&F){const d=t.value.replace(/\D/g,'').slice(0,3);if(d!==t.value)t.value=d;const n=parseInt(d,10);if(n>=1){F.parc=n;document.querySelectorAll('#fParc .chip').forEach(b=>b.classList.toggle('on',+b.dataset.n===F.parc));{const pm=$('#fParcMais');pm.textContent=n>12?n+'x':'+';pm.classList.toggle('on',n>12)}fHint()}}
  else if(t.id==='fDesc'&&F){F.desc=t.value;if(!F.catTouched){const g=guess(t.value);if(g&&g.cat){F.cat=g.cat;document.querySelectorAll('#fCat .chip').forEach(b=>b.classList.toggle('on',b.dataset.v===F.cat))}}}
  else if(t.id==='fDt'&&F&&t.value){F.date=t.value;document.querySelectorAll('#fDate .chip').forEach(b=>b.classList.toggle('on',b.dataset.v===F.date));fHint()}
  else if(t.id==='pq'){ui.q=t.value;const pos=t.selectionStart;render();const n=$('#pq');n.focus();n.setSelectionRange(pos,pos)}
});
document.addEventListener('beforeinput',e=>{const t=e.target;if(t.id!=='fAmt'||!F)return;e.preventDefault();
  const it=e.inputType||'';
  if(it.startsWith('delete'))F.cents=Math.floor(F.cents/10);
  else if(it.startsWith('insert')){const d=String(e.data||'').replace(/\D/g,'');if(it==='insertFromPaste'&&/[.,]\d{1,2}$/.test(e.data||'')){F.cents=Math.round(parseFloat(String(e.data).replace(/\./g,'').replace(',','.'))*100)||0}else for(const ch of d){if(F.cents<1e9)F.cents=F.cents*10+ +ch}}
  t.value=brl(F.cents/100);fHint();requestAnimationFrame(()=>t.setSelectionRange(t.value.length,t.value.length))});
document.addEventListener('focusin',e=>{if(e.target.id==='fAmt')requestAnimationFrame(()=>{const t=e.target;t.setSelectionRange(t.value.length,t.value.length)})});
function applyK(k,t){const f=t.dataset.k;let v=t.value.trim();
  if(f==='limite')v=+v.replace(/\./g,'').replace(',','.')||0;
  if(f==='final')v=v.replace(/\D/g,'').slice(-4);
  if(f==='diaFechamento'||f==='diaVencimento')v=Math.min(31,Math.max(1,parseInt(v)||(f==='diaFechamento'?9:16)));
  k[f]=v}
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.act;
  if(t.dataset.k&&!t.closest('.sheet')){applyK(K(),t);save();ui.idx=openIdx();render();toast('Salvo');return}
  if(t.dataset.f){const[o,k]=t.dataset.f.split('.');let v=t.value.trim();
    if(k==='limite')v=+v.replace(/\./g,'').replace(',','.')||0;
    if(k==='diaFechamento'||k==='diaVencimento'){v=Math.min(31,Math.max(1,parseInt(v)||(k==='diaFechamento'?9:16)))}
    S[o][k]=v;save();ui.idx=openIdx();render();toast('Salvo')}
  if(a==='kCorX'){K().cor=t.value;save();render();return}
  if(a==='nCorX'){NK.cor=t.value;document.querySelectorAll('[data-act=nCor]').forEach(b=>b.classList.remove('on'));const l=t.closest('label');l.classList.add('on');l.querySelector('span').style.background=t.value;return}
  if(a==='bkfile'&&t.files[0]){t.files[0].text().then(importarBackup);t.value=''}
  if(a==='pdffile'&&t.files[0]){I.pw=null;lerPdf(t.files[0])}
  if(a==='iP'){const x=I.items[+t.dataset.i];if(t.value==='__nova'){t.value=x.dono||'Você';openNovaImport(+t.dataset.i);return}x.dono=t.value}
  if(a==='iC'){I.items[+t.dataset.i].cat=t.value}
});
function openNovaImport(i){const st=$('.sheet').scrollTop;
  const box=document.createElement('div');box.className='addp';box.style.gridColumn='2/4';box.innerHTML=`<input class="inp" placeholder="Nome da pessoa" aria-label="Nome da pessoa"><button class="btn dark" style="height:44px">OK</button>`;
  const rowEl=[...document.querySelectorAll('[data-act=iP]')].find(s=>+s.dataset.i===i).closest('.irow');rowEl.appendChild(box);const inp=box.querySelector('input');inp.focus();
  const ok=()=>{const p=addPessoa(inp.value);if(!p)return;save();I.items[i].dono=p;sheetReview();$('.sheet').scrollTop=st};
  box.querySelector('button').onclick=ok;inp.onkeydown=ev=>{if(ev.key==='Enter')ok()}}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#sheet').innerHTML){closeSheet()}
  if(e.key==='Enter'&&e.target.id==='fNome'){e.preventDefault();$('[data-act=fAddOk]').click()}
  if(e.key==='Enter'&&e.target.id==='npNome'){$('[data-act=npOk]').click()}
});
['dragover','drop'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#iDrop');if(!d)return;e.preventDefault();if(ev==='drop'&&e.dataTransfer.files[0]){I.pw=null;lerPdf(e.dataTransfer.files[0])}}));

render();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
